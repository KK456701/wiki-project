name: HXZD Runtime CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Validate HXZD source and generated Wiki contract
        run: |
          node scripts/build-wiki-from-markdown.mjs \
            --input "core-rules-wiki/raw/company/35项核心制度指标完整提取.md" \
            --check
          node scripts/validate-wiki-contract.mjs

      - name: Run Java tests
        working-directory: backend-java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Build Vue frontend
        working-directory: frontend-vue
        run: |
          npm ci
          npm run build
