# 复制本文件为 config.yaml，并按本地环境修改。
# 本文件只保留 scripts/start-java-runtime.ps1 实际读取的顶层配置。

# 运行库：保存 Agent 会话、审批记录、诊断报告、Trace 链路等。
runtime_db_url: "jdbc:sqlite:runtime/wiki_agent_runtime.db"

# 双库只读 MCP 已内嵌在 Java 服务中，跟随 server.port 自动启动，无需 sidecar 配置。
# 业务事件抽取 MCP 是独立远端业务接口，与内嵌数据库 MCP 分开配置。
dbhub_biz_mcp_url: "http://127.0.0.1:5420/http/mcp"

# 内嵌 MCP 对外暴露的双库逻辑编号、工具名和数据库范围。
dbhub_business_source_id: "winex_all_dev"
dbhub_business_execute_tool: "execute_sql_winex_all_dev"
dbhub_business_database: "WiNEX_All_DEV"
dbhub_business_schema: "WINDBA_GN"
dbhub_real_source_id: "winex_aima"
dbhub_real_execute_tool: "execute_sql_winex_aima"
dbhub_real_database: "winex_aima"
dbhub_real_schema: "dbo"

# 安全默认关闭；普通计算必须切换为 required，否则返回 SOURCE_EXTRACTION_DISABLED。
# required 会先经业务事件 MCP 抽取并原子替换真实库，失败时不会读取旧快照。
agent_extraction_mode: "disabled"
extraction_hospital_soid: ""

# 真实库写入默认关闭。启用时只通过进程环境变量提供：
# WIKI_SQLSERVER_ENABLED、WIKI_SQLSERVER_URL、WIKI_SQLSERVER_USERNAME、
# WIKI_SQLSERVER_PASSWORD。不要把真实地址或凭据写入本文件。

# 本地 MVP 审批页管理员密码。正式部署前必须修改。
admin_password: "CHANGE_ME"

# 默认模型与本地 Ollama。
default_model: "ollama-qwen3"
ollama_model: "qwen3:4B-instruct"
ollama_base_url: "http://127.0.0.1:11434"

# Java/Spring AI 访问外部模型 API 时的可选 HTTP 代理；本地部署不需要时留空。
java_http_proxy_url: ""

# API 模型、超时和其他 Spring 配置由 backend-java/src/main/resources/application.yml
# 及环境变量控制。API Key 请使用 DASHSCOPE_API_KEY、DEEPSEEK_API_KEY 等环境变量，
# 不要写入 config.yaml 或提交到 Git。
