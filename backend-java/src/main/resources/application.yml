server:
  address: 0.0.0.0
  port: 8766

spring:
  application:
    name: wiki-agent-java
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  jpa:
    open-in-view: false
  datasource:
    url: ${WIKI_RUNTIME_DB_URL:jdbc:sqlite:runtime/wiki_agent_runtime.db}
    driver-class-name: org.sqlite.JDBC
    username: ""
    password: ""
    hikari:
      maximum-pool-size: 6
      minimum-idle: 0
      connection-timeout: 5000
      connection-init-sql: PRAGMA busy_timeout=30000
  sql:
    init:
      mode: always
      schema-locations: classpath:sqlite-runtime-schema.sql
      continue-on-error: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

wiki:
  # knowledge.root 已废弃：知识库完全切换到 knowledge-index-mras（领导知识库）
  # 旧配置保留仅供测试兼容构造器使用
  knowledge:
    root: ${WIKI_KNOWLEDGE_ROOT:src/main/resources/core-rules-wiki}
  admin:
    password: ${WIKI_ADMIN_PASSWORD:CHANGE_ME}
  auth:
    session-hours: 8
  agent:
    default-model: ${AGENT_DEFAULT_MODEL:ollama-qwen3}
    planner-timeout: 90s
    final-answer-timeout: 120s
    compound-api-concurrency: 2
    compound-ollama-concurrency: 1
    compound-db-concurrency: 2
    compound-timeout: 300s
    trace-retention-days: 30
    trace-slow-request-ms: 120000
    trace-slow-llm-ms: 60000
    trace-tool-failure-warning-rate: 0.05
    trace-timeout-warning-rate: 0.05
    evidence-ttl-days: 30
    evidence-jsonl-path: runtime/agent_evidence_java.jsonl
    extraction:
      # 普通计算必须显式切换为 required：先抽取，再只查询真实库。
      mode: ${AGENT_EXTRACTION_MODE:required}
      # 医院范围只能由服务端环境变量提供，不能接收浏览器或模型覆盖。
      hospital-soid: ${WIKI_EXTRACTION_HOSPITAL_SOID:}
    upload:
      root: runtime/uploads
      max-bytes: 10485760
      max-uncompressed-bytes: 52428800
      max-entries: 2000
      max-rows-per-sheet: 5001
      max-columns: 100
    details:
      export-root: runtime/exports
      expire-hours: 24
      max-rows: 20000
      default-page-size: 50
    models:
      - id: ollama-qwen3
        name: Qwen3 4B（本地 Ollama）
        provider: ollama
        model: ${OLLAMA_MODEL:qwen3:4B-instruct}
        base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
        thinking: false
      - id: ollama-qwen3-8b-thinking
        name: Qwen3 8B 思考模式（本地 Ollama）
        provider: ollama
        model: ${OLLAMA_THINKING_MODEL:qwen3:8b}
        base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
        thinking: true
      - id: aliyun-qwen-plus
        name: Qwen-Plus 7B（阿里云百炼 API）
        provider: openai-compatible
        model: ${DASHSCOPE_QWEN_PLUS_MODEL:qwen-plus}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        completions-path: /chat/completions
        api-key: ${DASHSCOPE_API_KEY:}
        thinking: false
        enable-thinking: false
      - id: aliyun-qwen3-14b
        name: Qwen3 14B（阿里云百炼 API）
        provider: openai-compatible
        model: ${DASHSCOPE_QWEN3_14B_MODEL:qwen3-14b}
        base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        # Spring AI 默认路径自带 /v1；百炼官方 Base URL 已含 /v1，所以这里只追加 chat/completions。
        completions-path: /chat/completions
        api-key: ${DASHSCOPE_API_KEY:}
        # Qwen3 默认开启思考。Agent Planner 更需要稳定的结构化输出，默认关闭；需要时可通过环境变量开启。
        thinking: ${DASHSCOPE_QWEN3_14B_ENABLE_THINKING:false}
        enable-thinking: ${DASHSCOPE_QWEN3_14B_ENABLE_THINKING:false}
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash（API）
        provider: openai-compatible
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        thinking: false
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro（API）
        provider: openai-compatible
        model: ${DEEPSEEK_PRO_MODEL:deepseek-v4-pro}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        thinking: true
  sqlserver:
    # 默认关闭，避免启动时强制连接医院 SQL Server。
    # 启用后会创建独立的 sqlServerDataSource / JdbcTemplate / TransactionManager。
    # 运行时主库仍使用上方 spring.datasource（SQLite）；业务只读默认仍走 DBHub。
    enabled: ${WIKI_SQLSERVER_ENABLED:true}
    url: ${WIKI_SQLSERVER_URL:}
    username: ${WIKI_SQLSERVER_USERNAME:}
    password: ${WIKI_SQLSERVER_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    schema: ${WIKI_SQLSERVER_SCHEMA:dbo}
    hikari:
      maximum-pool-size: ${WIKI_SQLSERVER_MAX_POOL_SIZE:2}
      minimum-idle: ${WIKI_SQLSERVER_MIN_IDLE:1}
      connection-timeout: ${WIKI_SQLSERVER_CONNECTION_TIMEOUT:5000}
    # 业务 MCP 抽取所需的医院 SOID，按院方要求先写死在配置中。
    hospital-soid: 991827
    jpa:
      ddl-auto: none
      show-sql: ${WIKI_SQLSERVER_SHOW_SQL:false}
      database-platform: org.hibernate.dialect.SQLServerDialect
      open-in-view: false
  dbhub:
    api-url: ${DBHUB_API_URL:http://127.0.0.1:8080}
    mcp-url: ${DBHUB_MCP_URL:http://127.0.0.1:8080/mcp}
    biz-mcp-url: ${DBHUB_BIZ_MCP_URL:http://172.16.9.73/mras-mcp-mdm/http/mcp}
    timeout-seconds: ${DBHUB_TIMEOUT_SECONDS:120}
    sources:
      business:
        source-id: ${DBHUB_BUSINESS_SOURCE_ID:winex_all_dev}
        execute-tool: ${DBHUB_BUSINESS_EXECUTE_TOOL:execute_sql_winex_all_dev}
        database-name: ${DBHUB_BUSINESS_DATABASE:WiNEX_All_DEV}
        schema-name: ${DBHUB_BUSINESS_SCHEMA:WINDBA_GN}
      real:
        source-id: ${DBHUB_REAL_SOURCE_ID:winex_aima}
        execute-tool: ${DBHUB_REAL_EXECUTE_TOOL:execute_sql_winex_aima}
        database-name: ${DBHUB_REAL_DATABASE:winex_aima}
        schema-name: ${DBHUB_REAL_SCHEMA:dbo}
